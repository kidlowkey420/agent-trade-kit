name: Quiver signal bot

on:
  schedule:
    # Weekdays at 14:17 and 20:17 UTC (after US open and before close).
    - cron: "17 14,20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log signals, place no orders)"
        type: boolean
        default: true

# Never let two runs overlap and double-buy.
concurrency:
  group: quiver-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run bot
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          QUIVER_API_TOKEN: ${{ secrets.QUIVER_API_TOKEN }}
          # Demo account unless the repo variable OKX_DEMO is explicitly "0".
          OKX_DEMO: ${{ vars.OKX_DEMO || '1' }}
          BOT_LIVE_TRADING: ${{ vars.BOT_LIVE_TRADING }}
          SIGNAL_MODE: ${{ vars.SIGNAL_MODE || 'both' }}
          TRADE_USD: ${{ vars.TRADE_USD || '100' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          MAX_NEW_TRADES_PER_RUN: ${{ vars.MAX_NEW_TRADES_PER_RUN }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || vars.DRY_RUN }}
        run: node_modules/.bin/tsx bots/quiver-signal/src/main.ts
